<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Ladies Apparel POS</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#3D1F3D" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>
  body { -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo } = React;


const SIZES = ["S", "M", "L", "XL", "XXL"];
const STORE_KEY = "ladies-pos-data-v1";

const CATEGORIES = [
  "Kurtis", "Kurta Sets", "Co-ord Sets", "Formal Shirts", "Formal Tops", "Blouses",
  "Trousers", "Pants", "Palazzo Pants", "Dresses", "Blazers", "Jackets", "Tunics",
  "Skirts", "Crop Top", "Top", "Churidar Set", "Salwar Suit", "Patiala Suit",
  "Anarkali", "Straight Suit", "Saree", "Dupatta",
];

const emptySizeMap = () => ({ S: 0, M: 0, L: 0, XL: 0, XXL: 0 });
const sumSizeMap = (m) => SIZES.reduce((a, s) => a + (Number(m[s]) || 0), 0);
const uid = () => Math.random().toString(36).slice(2, 10);
const money = (n) => "₹" + (Number(n) || 0).toLocaleString("en-IN", { maximumFractionDigits: 2 });
const todayISO = () => new Date().toISOString().slice(0, 10);

function compressImage(file, maxDim, quality) {
  maxDim = maxDim || 480; quality = quality || 0.7;
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let width = img.width, height = img.height;
        if (width > height && width > maxDim) { height = (height * maxDim) / width; width = maxDim; }
        else if (height > maxDim) { width = (width * maxDim) / height; height = maxDim; }
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        canvas.getContext("2d").drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

const initialData = { inwardRecords: [], sales: [], discards: [] };

function downloadCSV(rows, filename) {
  const esc = (v) => {
    const s = String(v ?? "");
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  const csv = rows.map((row) => row.map(esc).join(",")).join("\n");
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function LadiesPOS() {
  const [data, setData] = useState(initialData);
  const [tab, setTab] = useState(() => {
    try {
      const params = new URLSearchParams(window.location.search);
      const t = params.get("tab");
      const valid = ["dashboard", "inward", "pos", "stock", "analytics", "export"];
      return valid.includes(t) ? t : "dashboard";
    } catch (e) { return "dashboard"; }
  });

  useEffect(() => {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (raw) setData((d) => ({ ...initialData, ...JSON.parse(raw) }));
    } catch (e) {}
  }, []);
  useEffect(() => {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(data)); } catch (e) {}
  }, [data]);

  const update = (key, fn) => setData((d) => ({ ...d, [key]: fn(d[key]) }));

  const derived = useMemo(() => {
    const key = (c, d, s) => `${c}__${d}__${s}`;
    const stock = {}; // key -> {category, design, size, received, sold, discarded}

    data.inwardRecords.forEach((r) => {
      SIZES.forEach((s) => {
        const k = key(r.category, r.design, s);
        stock[k] = stock[k] || { category: r.category, design: r.design, size: s, received: 0, sold: 0, discarded: 0 };
        stock[k].received += Number(r.sizes[s]) || 0;
      });
    });
    data.sales.forEach((sale) => {
      sale.items.forEach((it) => {
        const k = key(it.category, it.design, it.size);
        stock[k] = stock[k] || { category: it.category, design: it.design, size: it.size, received: 0, sold: 0, discarded: 0 };
        stock[k].sold += Number(it.qty) || 0;
      });
    });
    (data.discards || []).forEach((d) => {
      const k = key(d.category, d.design, d.size);
      stock[k] = stock[k] || { category: d.category, design: d.design, size: d.size, received: 0, sold: 0, discarded: 0 };
      stock[k].discarded += Number(d.qty) || 0;
    });

    // avg cost & last selling price & latest photo per design
    const costByDesign = {};
    const priceByDesign = {};
    const photoByDesign = {};
    data.inwardRecords.forEach((r) => {
      const b = costByDesign[r.design] || { total: 0, count: 0 };
      b.total += Number(r.costPrice) || 0; b.count += 1;
      costByDesign[r.design] = b;
      priceByDesign[r.design] = Number(r.sellingPrice) || priceByDesign[r.design] || 0;
      if (r.photo) photoByDesign[r.design] = r.photo;
    });
    const avgCost = (design) => {
      const b = costByDesign[design];
      return b && b.count ? b.total / b.count : 0;
    };
    const suggestedPrice = (design) => priceByDesign[design] || 0;
    const photoFor = (design) => photoByDesign[design] || null;

    const stockRows = Object.values(stock).map((s) => ({ ...s, remaining: s.received - s.sold - s.discarded }));

    const totalReceived = stockRows.reduce((a, s) => a + s.received, 0);
    const totalSold = stockRows.reduce((a, s) => a + s.sold, 0);
    const totalRemaining = stockRows.reduce((a, s) => a + s.remaining, 0);
    const stockValue = stockRows.reduce((a, s) => a + Math.max(s.remaining, 0) * avgCost(s.design), 0);

    let totalRevenue = 0, totalCOGS = 0;
    const paymentTotals = { Cash: 0, UPI: 0, Card: 0, "Due/Credit": 0 };
    let totalDueOutstanding = 0;
    data.sales.forEach((sale) => {
      totalRevenue += sale.total;
      sale.items.forEach((it) => { totalCOGS += (Number(it.costPrice) || 0) * Number(it.qty); });
      paymentTotals[sale.paymentMode] = (paymentTotals[sale.paymentMode] || 0) + sale.total;
      if (sale.paymentMode === "Due/Credit") totalDueOutstanding += Math.max(sale.total - (Number(sale.amountPaid) || 0), 0);
    });

    const todayStr = todayISO();
    const thisMonth = todayStr.slice(0, 7);
    let salesToday = 0, salesMonth = 0;
    data.sales.forEach((s) => {
      if (s.date === todayStr) salesToday += s.total;
      if ((s.date || "").slice(0, 7) === thisMonth) salesMonth += s.total;
    });

    return {
      stockRows, avgCost, suggestedPrice, photoFor, totalReceived, totalSold, totalRemaining, stockValue,
      totalRevenue, totalCOGS, netProfit: totalRevenue - totalCOGS, paymentTotals, totalDueOutstanding,
      salesToday, salesMonth,
    };
  }, [data]);

  const TABS = [
    { id: "dashboard", label: "Dashboard", icon: "📊" },
    { id: "inward", label: "Inward", icon: "📥" },
    { id: "pos", label: "Sell", icon: "🛒" },
    { id: "stock", label: "Stock", icon: "📦" },
    { id: "analytics", label: "Profit", icon: "📈" },
    { id: "export", label: "Export", icon: "⬇️" },
  ];

  return (
    <div className="min-h-screen bg-[#FBF6F3] text-[#33202A] font-sans pb-20">
      <header className="bg-[#3D1F3D] text-[#FBF6F3] px-4 py-4 sticky top-0 z-20 shadow-md">
        <h1 className="text-lg font-bold tracking-tight flex items-center gap-2">
          <span className="text-[#E0A899]">👗</span> Ladies Apparel POS
        </h1>
      </header>
      <main className="max-w-3xl mx-auto p-3">
        {tab === "dashboard" && <Dashboard derived={derived} setTab={setTab} />}
        {tab === "inward" && <InwardPage data={data} update={update} />}
        {tab === "pos" && <POSPage data={data} update={update} derived={derived} />}
        {tab === "stock" && <StockPage data={data} update={update} derived={derived} />}
        {tab === "analytics" && <AnalyticsPage data={data} update={update} derived={derived} />}
        {tab === "export" && <ExportPage data={data} derived={derived} />}
      </main>
      <nav className="fixed bottom-0 left-0 right-0 bg-[#3D1F3D] border-t border-black/20 flex justify-around py-1.5 z-20">
        {TABS.map(({ id, label, icon }) => (
          <button key={id} onClick={() => setTab(id)}
            className={"flex flex-col items-center gap-0.5 px-2 py-1.5 rounded-lg text-[10px] font-medium " + (tab === id ? "text-[#E0A899]" : "text-[#FBF6F3]/50")}>
            <span className="text-base leading-none">{icon}</span>{label}
          </button>
        ))}
      </nav>
    </div>
  );
}

// -------- Shared UI --------
function Section({ title, children, right }) {
  return (
    <div className="mb-4">
      <div className="flex items-center justify-between mb-2">
        <h2 className="text-sm font-bold uppercase tracking-wide text-[#33202A]/70">{title}</h2>
        {right}
      </div>
      {children}
    </div>
  );
}
function Card({ children, className = "" }) {
  return <div className={`bg-white rounded-xl border border-black/5 shadow-sm p-3 ${className}`}>{children}</div>;
}
function Field({ label, children }) {
  return (
    <label className="block mb-2">
      <span className="block text-xs font-medium text-[#33202A]/60 mb-1">{label}</span>
      {children}
    </label>
  );
}
const inputCls = "w-full rounded-lg border border-black/10 px-3 py-2 text-sm bg-[#FFFDFC] focus:outline-none focus:ring-2 focus:ring-[#E0A899]";
function TextInput(props) { return <input {...props} className={inputCls} />; }
function SelectInput({ children, ...props }) { return <select {...props} className={inputCls}>{children}</select>; }
function SizeGrid({ value, onChange }) {
  return (
    <div className="grid grid-cols-5 gap-1.5">
      {SIZES.map((s) => (
        <label key={s} className="text-center">
          <span className="block text-[10px] font-semibold text-[#33202A]/50 mb-0.5">{s}</span>
          <input type="number" min="0" value={value[s] || ""} onChange={(e) => onChange({ ...value, [s]: e.target.value })}
            className="w-full rounded-md border border-black/10 px-1 py-1.5 text-sm text-center bg-[#FFFDFC]" />
        </label>
      ))}
    </div>
  );
}
function AddButton({ onClick, label = "Add" }) {
  return (
    <button onClick={onClick} className="flex items-center gap-1 bg-[#3D1F3D] text-[#FBF6F3] text-xs font-semibold px-3 py-1.5 rounded-lg">
      + {label}
    </button>
  );
}
function Modal({ title, onClose, children }) {
  return (
    <div className="fixed inset-0 bg-black/40 z-30 flex items-end sm:items-center justify-center">
      <div className="bg-white rounded-t-2xl sm:rounded-2xl w-full sm:max-w-md max-h-[85vh] overflow-y-auto p-4">
        <div className="flex items-center justify-between mb-3">
          <h3 className="font-bold text-sm">{title}</h3>
          <button onClick={onClose}>✕</button>
        </div>
        {children}
      </div>
    </div>
  );
}
function EmptyState({ text }) { return <div className="text-center text-sm text-[#33202A]/40 py-8">{text}</div>; }

// -------- Dashboard --------
function Dashboard({ derived, setTab }) {
  const stat = (label, value, warn) => (
    <Card className="flex-1 min-w-[140px]">
      <div className="text-[10px] uppercase font-semibold text-[#33202A]/40">{label}</div>
      <div className={`text-xl font-bold mt-1 ${warn ? "text-red-600" : ""}`}>{value}</div>
    </Card>
  );
  return (
    <div>
      <Section title="Key Metrics">
        <div className="flex flex-wrap gap-2 mb-2">
          {stat("Pieces Received", derived.totalReceived)}
          {stat("Pieces Sold", derived.totalSold)}
          {stat("Pieces Remaining", derived.totalRemaining)}
          {stat("Stock Value (cost)", money(derived.stockValue))}
        </div>
        <div className="flex flex-wrap gap-2">
          {stat("Sales Today", money(derived.salesToday))}
          {stat("Sales This Month", money(derived.salesMonth))}
          {stat("Net Profit (all time)", money(derived.netProfit))}
          {stat("Due Outstanding", money(derived.totalDueOutstanding), derived.totalDueOutstanding > 0)}
        </div>
      </Section>
      <Section title="Quick Actions">
        <div className="grid grid-cols-2 gap-2">
          <button onClick={() => setTab("inward")} className="bg-white border border-black/10 rounded-xl p-3 text-left text-sm font-semibold">+ Receive Stitched Stock</button>
          <button onClick={() => setTab("pos")} className="bg-white border border-black/10 rounded-xl p-3 text-left text-sm font-semibold">+ New Sale</button>
        </div>
      </Section>
    </div>
  );
}

// -------- Inward Page --------
function InwardPage({ data, update }) {
  const [open, setOpen] = useState(false);
  const [form, setForm] = useState({ category: "", design: "", sizes: emptySizeMap(), costPrice: "", sellingPrice: "", date: todayISO(), photo: null });
  const [photoBusy, setPhotoBusy] = useState(false);
  const [confirmId, setConfirmId] = useState(null);

  const designsInCategory = [...new Set(data.inwardRecords.filter((r) => r.category === form.category).map((r) => r.design))];

  const handlePhoto = async (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    setPhotoBusy(true);
    try {
      const dataUrl = await compressImage(file);
      setForm((f) => ({ ...f, photo: dataUrl }));
    } catch (err) {}
    setPhotoBusy(false);
  };

  const save = () => {
    if (!form.category || !form.design) return;
    update("inwardRecords", (arr) => [...arr, {
      id: uid(), category: form.category, design: form.design, sizes: form.sizes,
      costPrice: Number(form.costPrice) || 0, sellingPrice: Number(form.sellingPrice) || 0, date: form.date,
      photo: form.photo || null,
    }]);
    setForm({ category: form.category, design: "", sizes: emptySizeMap(), costPrice: "", sellingPrice: "", date: todayISO(), photo: null });
    setOpen(false);
  };

  const deleteRecord = (id) => {
    update("inwardRecords", (arr) => arr.filter((r) => r.id !== id));
    setConfirmId(null);
  };

  const totalPieces = sumSizeMap(form.sizes);

  return (
    <div>
      <Section title="Stitched Stock Received" right={<AddButton onClick={() => setOpen(true)} label="Receive Stock" />}>
        {data.inwardRecords.length === 0 ? <EmptyState text="No stock received yet. Tap 'Receive Stock' to log your first batch." /> : (
          <div className="space-y-1.5">
            {[...data.inwardRecords].reverse().map((r) => (
              <Card key={r.id}>
                <div className="flex justify-between items-start gap-2">
                  {r.photo && <img src={r.photo} alt={r.design} className="w-12 h-12 rounded-lg object-cover shrink-0" />}
                  <div className="flex-1">
                    <div className="font-semibold text-sm">{r.design}</div>
                    <div className="text-xs text-[#33202A]/50">{r.category} · {r.date}</div>
                  </div>
                  <div className="text-right text-xs shrink-0">
                    <div>Cost {money(r.costPrice)}</div>
                    <div>MRP {money(r.sellingPrice)}</div>
                  </div>
                </div>
                <div className="text-xs mt-1.5 font-medium">{SIZES.map((s) => `${s}:${r.sizes[s] || 0}`).join("   ")} · {sumSizeMap(r.sizes)} pcs</div>
                {confirmId === r.id ? (
                  <div className="flex items-center gap-2 mt-2 pt-2 border-t border-black/10">
                    <span className="text-xs text-red-600 flex-1">Delete this entry? Its received stock will be removed too.</span>
                    <button onClick={() => deleteRecord(r.id)} className="text-xs font-bold bg-red-600 text-white px-2.5 py-1 rounded-md">Delete</button>
                    <button onClick={() => setConfirmId(null)} className="text-xs font-semibold px-2.5 py-1 rounded-md border border-black/10">Cancel</button>
                  </div>
                ) : (
                  <button onClick={() => setConfirmId(r.id)} className="text-xs font-semibold text-red-500 mt-2">
                    🗑️ Delete Entry
                  </button>
                )}
              </Card>
            ))}
          </div>
        )}
      </Section>

      {open && (
        <Modal title="Receive Stitched Stock" onClose={() => setOpen(false)}>
          <Field label="Category">
            <SelectInput value={form.category} onChange={(e) => setForm({ ...form, category: e.target.value })}>
              <option value="">Choose category…</option>
              {CATEGORIES.map((c) => <option key={c} value={c}>{c}</option>)}
            </SelectInput>
          </Field>
          <Field label="Design / Style Name">
            <input list="design-suggestions" value={form.design} onChange={(e) => setForm({ ...form, design: e.target.value })}
              className={inputCls} placeholder="e.g. Navy Floral Kurti" />
            <datalist id="design-suggestions">
              {designsInCategory.map((d) => <option key={d} value={d} />)}
            </datalist>
          </Field>
          <Field label="Quantity Received by Size (1 fabric → full S–XXL set)">
            <SizeGrid value={form.sizes} onChange={(v) => setForm({ ...form, sizes: v })} />
          </Field>
          <div className="text-xs text-[#33202A]/50 mb-2">{totalPieces} pieces total</div>
          <Field label="Cost Price per Piece"><TextInput type="number" value={form.costPrice} onChange={(e) => setForm({ ...form, costPrice: e.target.value })} /></Field>
          <Field label="Selling Price per Piece (MRP)"><TextInput type="number" value={form.sellingPrice} onChange={(e) => setForm({ ...form, sellingPrice: e.target.value })} /></Field>
          <Field label="Received Date"><TextInput type="date" value={form.date} onChange={(e) => setForm({ ...form, date: e.target.value })} /></Field>
          <Field label="Photo (optional — take or choose a picture of the item)">
            <div className="flex items-center gap-2">
              {form.photo && <img src={form.photo} alt="preview" className="w-14 h-14 rounded-lg object-cover" />}
              <label className="flex-1 text-center text-xs font-semibold bg-[#FFFDFC] border border-black/10 rounded-lg py-2.5 cursor-pointer">
                {photoBusy ? "Processing…" : form.photo ? "Change Photo" : "Take / Choose Photo"}
                <input type="file" accept="image/*" capture="environment" onChange={handlePhoto} className="hidden" />
              </label>
              {form.photo && (
                <button onClick={() => setForm({ ...form, photo: null })} className="text-red-500 text-xs font-semibold">Remove</button>
              )}
            </div>
          </Field>
          <button onClick={save} className="w-full bg-[#3D1F3D] text-[#FBF6F3] font-semibold py-2.5 rounded-lg mt-1">Save Stock Entry</button>
        </Modal>
      )}
    </div>
  );
}

// -------- POS Page --------
function POSPage({ data, update, derived }) {
  const [customer, setCustomer] = useState({ name: "", phone: "" });
  const [cart, setCart] = useState([]);
  const [itemForm, setItemForm] = useState({ category: "", design: "", size: "", qty: "1", price: "" });
  const [paymentMode, setPaymentMode] = useState("Cash");
  const [amountPaid, setAmountPaid] = useState("");

  const designsInCategory = [...new Set(
    derived.stockRows.filter((s) => s.category === itemForm.category && s.remaining > 0).map((s) => s.design)
  )];
  const sizesForDesign = derived.stockRows.filter(
    (s) => s.category === itemForm.category && s.design === itemForm.design && s.remaining > 0
  );

  const pickDesign = (design) => {
    setItemForm({ ...itemForm, design, size: "", price: derived.suggestedPrice(design) || "" });
  };

  const addToCart = () => {
    if (!itemForm.category || !itemForm.design || !itemForm.size || !itemForm.qty) return;
    const costPrice = derived.avgCost(itemForm.design);
    setCart((c) => [...c, {
      id: uid(), category: itemForm.category, design: itemForm.design, size: itemForm.size,
      qty: Number(itemForm.qty), price: Number(itemForm.price) || 0, costPrice,
    }]);
    setItemForm({ category: "", design: "", size: "", qty: "1", price: "" });
  };

  const removeFromCart = (id) => setCart((c) => c.filter((x) => x.id !== id));
  const cartTotal = cart.reduce((a, i) => a + i.qty * i.price, 0);

  const checkout = () => {
    if (cart.length === 0) return;
    const total = cartTotal;
    const paid = paymentMode === "Due/Credit" ? (Number(amountPaid) || 0) : total;
    update("sales", (arr) => [...arr, {
      id: uid(), customerName: customer.name, phone: customer.phone, date: todayISO(),
      items: cart, total, paymentMode, amountPaid: paid,
    }]);
    setCart([]); setCustomer({ name: "", phone: "" }); setPaymentMode("Cash"); setAmountPaid("");
  };

  return (
    <div>
      <Section title="Customer">
        <Card>
          <div className="grid grid-cols-2 gap-2">
            <Field label="Customer Name"><TextInput value={customer.name} onChange={(e) => setCustomer({ ...customer, name: e.target.value })} /></Field>
            <Field label="Phone Number"><TextInput value={customer.phone} onChange={(e) => setCustomer({ ...customer, phone: e.target.value })} /></Field>
          </div>
        </Card>
      </Section>

      <Section title="Add Item to Cart">
        <Card>
          <Field label="Category">
            <SelectInput value={itemForm.category} onChange={(e) => setItemForm({ ...itemForm, category: e.target.value, design: "", size: "", price: "" })}>
              <option value="">Choose category…</option>
              {CATEGORIES.map((c) => <option key={c} value={c}>{c}</option>)}
            </SelectInput>
          </Field>
          <Field label="Design">
            <SelectInput value={itemForm.design} onChange={(e) => pickDesign(e.target.value)} disabled={!itemForm.category}>
              <option value="">{itemForm.category ? "Choose design…" : "Select category first"}</option>
              {designsInCategory.map((d) => <option key={d} value={d}>{d}</option>)}
            </SelectInput>
          </Field>
          <Field label="Size">
            <SelectInput value={itemForm.size} onChange={(e) => setItemForm({ ...itemForm, size: e.target.value })} disabled={!itemForm.design}>
              <option value="">{itemForm.design ? "Choose size…" : "Select design first"}</option>
              {sizesForDesign.map((s) => <option key={s.size} value={s.size}>{s.size} — {s.remaining} left</option>)}
            </SelectInput>
          </Field>
          <div className="grid grid-cols-2 gap-2">
            <Field label="Quantity"><TextInput type="number" min="1" value={itemForm.qty} onChange={(e) => setItemForm({ ...itemForm, qty: e.target.value })} /></Field>
            <Field label="Price per Piece"><TextInput type="number" value={itemForm.price} onChange={(e) => setItemForm({ ...itemForm, price: e.target.value })} /></Field>
          </div>
          <button onClick={addToCart} className="w-full bg-[#3D1F3D] text-[#FBF6F3] font-semibold py-2 rounded-lg mt-1 flex items-center justify-center gap-1">
            + Add to Cart
          </button>
        </Card>
      </Section>

      <Section title={`Cart (${cart.length})`}>
        {cart.length === 0 ? <EmptyState text="Cart is empty. Add items above." /> : (
          <div className="space-y-1.5">
            {cart.map((it) => (
              <Card key={it.id} className="flex justify-between items-center">
                <div>
                  <div className="font-semibold text-sm">{it.design} · {it.size}</div>
                  <div className="text-xs text-[#33202A]/50">{it.qty} × {money(it.price)} = {money(it.qty * it.price)}</div>
                </div>
                <button onClick={() => removeFromCart(it.id)} className="text-red-500">🗑️</button>
              </Card>
            ))}
            <Card className="flex justify-between items-center bg-[#3D1F3D] text-[#FBF6F3]">
              <span className="font-semibold text-sm">Total</span>
              <span className="font-bold">{money(cartTotal)}</span>
            </Card>
          </div>
        )}
      </Section>

      {cart.length > 0 && (
        <Section title="Payment">
          <Card>
            <Field label="Payment Mode">
              <SelectInput value={paymentMode} onChange={(e) => setPaymentMode(e.target.value)}>
                <option>Cash</option><option>UPI</option><option>Card</option><option>Due/Credit</option>
              </SelectInput>
            </Field>
            {paymentMode === "Due/Credit" && (
              <Field label="Amount Paid Now (leave 0 if fully on credit)">
                <TextInput type="number" value={amountPaid} onChange={(e) => setAmountPaid(e.target.value)} />
              </Field>
            )}
            <button onClick={checkout} className="w-full bg-green-700 text-white font-bold py-2.5 rounded-lg mt-1">
              Complete Sale — {money(cartTotal)}
            </button>
          </Card>
        </Section>
      )}
    </div>
  );
}

// -------- Stock Page --------
function StockPage({ data, update, derived }) {
  const [filterCat, setFilterCat] = useState("ALL");
  const [discardRow, setDiscardRow] = useState(null);
  const [discardForm, setDiscardForm] = useState({ qty: "", reason: "" });
  const rows = derived.stockRows.filter((s) => s.received > 0 && (filterCat === "ALL" || s.category === filterCat));
  const usedCategories = [...new Set(derived.stockRows.map((s) => s.category))];

  const openDiscard = (row) => { setDiscardRow(row); setDiscardForm({ qty: "", reason: "" }); };

  const saveDiscard = () => {
    if (!discardRow || !discardForm.qty) return;
    update("discards", (arr) => [...arr, {
      id: uid(), category: discardRow.category, design: discardRow.design, size: discardRow.size,
      qty: Number(discardForm.qty), reason: discardForm.reason, date: todayISO(),
    }]);
    setDiscardRow(null);
  };

  return (
    <div>
      <Section title="Stock — Remaining (Received)" right={
        <SelectInput value={filterCat} onChange={(e) => setFilterCat(e.target.value)} className="!w-auto text-xs py-1">
          <option value="ALL">All categories</option>
          {usedCategories.map((c) => <option key={c} value={c}>{c}</option>)}
        </SelectInput>
      }>
        {rows.length === 0 ? <EmptyState text="No stock yet." /> : (
          <div className="space-y-1.5">
            {rows.map((s, i) => (
              <Card key={i}>
                <div className="flex justify-between items-center">
                  <div>
                    <div className="font-semibold text-sm">{s.design}</div>
                    <div className="text-xs text-[#33202A]/50">
                      {s.category} · Size {s.size}{s.discarded > 0 ? ` · ${s.discarded} discarded` : ""}
                    </div>
                  </div>
                  <div className={`text-right font-bold ${s.remaining <= 0 ? "text-red-600" : ""}`}>
                    {s.remaining} <span className="text-xs font-normal text-[#33202A]/40">({s.received})</span>
                  </div>
                </div>
                <button onClick={() => openDiscard(s)} className="text-xs font-semibold text-red-500 mt-1.5">
                  🗑️ Discard / Write Off Stock
                </button>
              </Card>
            ))}
          </div>
        )}
      </Section>

      {discardRow && (
        <Modal title="Discard / Write Off Stock" onClose={() => setDiscardRow(null)}>
          <div className="text-sm font-semibold mb-1">{discardRow.design} · Size {discardRow.size}</div>
          <div className="text-xs text-[#33202A]/50 mb-3">Currently remaining: {discardRow.remaining}</div>
          <Field label="Quantity to Discard">
            <TextInput type="number" min="1" value={discardForm.qty} onChange={(e) => setDiscardForm({ ...discardForm, qty: e.target.value })} />
          </Field>
          <Field label="Reason (optional — damaged, lost, missing…)">
            <TextInput value={discardForm.reason} onChange={(e) => setDiscardForm({ ...discardForm, reason: e.target.value })} />
          </Field>
          <button onClick={saveDiscard} className="w-full bg-red-600 text-white font-semibold py-2.5 rounded-lg mt-1">Confirm Discard</button>
        </Modal>
      )}
    </div>
  );
}

// -------- Analytics Page --------
function AnalyticsPage({ data, update, derived }) {
  const [subTab, setSubTab] = useState("summary");
  const [confirmId, setConfirmId] = useState(null);

  const deleteSale = (id) => {
    update("sales", (arr) => arr.filter((s) => s.id !== id));
    setConfirmId(null);
  };

  return (
    <div>
      <div className="flex gap-1.5 mb-3">
        {[["summary", "Summary"], ["history", "Customers"]].map(([id, label]) => (
          <button key={id} onClick={() => setSubTab(id)} className={`text-xs font-semibold px-3 py-1.5 rounded-full ${subTab === id ? "bg-[#3D1F3D] text-white" : "bg-white border border-black/10"}`}>{label}</button>
        ))}
      </div>

      {subTab === "summary" && (
        <div>
          <Section title="Profit Summary">
            <Card>
              <div className="grid grid-cols-3 gap-2 text-center">
                <div><div className="text-[10px] text-[#33202A]/40">Revenue</div><div className="font-bold">{money(derived.totalRevenue)}</div></div>
                <div><div className="text-[10px] text-[#33202A]/40">COGS</div><div className="font-bold">{money(derived.totalCOGS)}</div></div>
                <div><div className="text-[10px] text-[#33202A]/40">Net Profit</div><div className="font-bold text-green-700">{money(derived.netProfit)}</div></div>
              </div>
            </Card>
          </Section>
          <Section title="Payment Mode Breakdown">
            <Card>
              <div className="grid grid-cols-2 gap-2 text-sm">
                {Object.entries(derived.paymentTotals).map(([mode, amt]) => (
                  <div key={mode} className="flex justify-between">
                    <span className="text-[#33202A]/60">{mode}</span>
                    <span className="font-semibold">{money(amt)}</span>
                  </div>
                ))}
              </div>
              {derived.totalDueOutstanding > 0 && (
                <div className="mt-2 pt-2 border-t border-black/10 flex justify-between text-sm">
                  <span className="text-red-600 font-medium">Outstanding Due</span>
                  <span className="font-bold text-red-600">{money(derived.totalDueOutstanding)}</span>
                </div>
              )}
            </Card>
          </Section>
        </div>
      )}

      {subTab === "history" && (
        <Section title="Customer Purchase History">
          {data.sales.length === 0 ? <EmptyState text="No sales yet." /> : (
            <div className="space-y-1.5">
              {[...data.sales].reverse().map((s) => (
                <Card key={s.id}>
                  <div className="flex justify-between items-start">
                    <div className="flex items-center gap-1.5">
                      👤
                      <div>
                        <div className="font-semibold text-sm">{s.customerName || "Walk-in"}</div>
                        <div className="text-xs text-[#33202A]/50">{s.phone} · {s.date}</div>
                      </div>
                    </div>
                    <div className="text-right">
                      <div className="font-bold">{money(s.total)}</div>
                      <div className="text-[10px] text-[#33202A]/40">{s.paymentMode}</div>
                    </div>
                  </div>
                  <div className="text-xs mt-1.5 text-[#33202A]/60">
                    {s.items.map((it) => `${it.design} (${it.size}) ×${it.qty}`).join(", ")}
                  </div>
                  {confirmId === s.id ? (
                    <div className="flex items-center gap-2 mt-2 pt-2 border-t border-black/10">
                      <span className="text-xs text-red-600 flex-1">Delete this sale? Stock will be added back.</span>
                      <button onClick={() => deleteSale(s.id)} className="text-xs font-bold bg-red-600 text-white px-2.5 py-1 rounded-md">Delete</button>
                      <button onClick={() => setConfirmId(null)} className="text-xs font-semibold px-2.5 py-1 rounded-md border border-black/10">Cancel</button>
                    </div>
                  ) : (
                    <button onClick={() => setConfirmId(s.id)} className="text-xs font-semibold text-red-500 mt-2">
                      🗑️ Delete / Return
                    </button>
                  )}
                </Card>
              ))}
            </div>
          )}
        </Section>
      )}
    </div>
  );
}

// -------- Export Page --------
function ExportPage({ data, derived }) {
  const [busy, setBusy] = useState(false);

  const exportSalesLog = () => {
    const header = ["Date", "Customer", "Phone", "Category", "Design", "Size", "Qty", "Price/Pc", "Cost/Pc", "Line Revenue", "Line Profit", "Payment Mode"];
    const rows = [header];
    data.sales.forEach((s) => {
      s.items.forEach((it) => {
        rows.push([
          s.date, s.customerName, s.phone, it.category, it.design, it.size, it.qty, it.price, it.costPrice.toFixed(2),
          (it.qty * it.price).toFixed(2), (it.qty * (it.price - it.costPrice)).toFixed(2), s.paymentMode,
        ]);
      });
    });
    downloadCSV(rows, `Sales_Log_${todayISO()}.csv`);
  };

  const exportStockSummary = () => {
    const header = ["Category", "Design", "Size", "Received", "Sold", "Remaining", "Cost/Pc", "Selling Price/Pc", "Stock Value"];
    const rows = [header];
    derived.stockRows.filter((s) => s.received > 0).forEach((s) => {
      const cost = derived.avgCost(s.design);
      rows.push([
        s.category, s.design, s.size, s.received, s.sold, s.remaining,
        cost.toFixed(2), derived.suggestedPrice(s.design).toFixed(2), (Math.max(s.remaining, 0) * cost).toFixed(2),
      ]);
    });
    downloadCSV(rows, `Stock_Summary_${todayISO()}.csv`);
  };

  const exportSalesLogWithPhotos = async () => {
    setBusy(true);
    try {
      const workbook = new ExcelJS.Workbook();
      const sheet = workbook.addWorksheet("Sales Log");
      sheet.columns = [
        { header: "Date", key: "date", width: 12 },
        { header: "Customer", key: "customer", width: 16 },
        { header: "Phone", key: "phone", width: 14 },
        { header: "Photo", key: "photo", width: 12 },
        { header: "Category", key: "category", width: 14 },
        { header: "Design", key: "design", width: 22 },
        { header: "Size", key: "size", width: 8 },
        { header: "Qty", key: "qty", width: 8 },
        { header: "Price/Pc", key: "price", width: 10 },
        { header: "Cost/Pc", key: "cost", width: 10 },
        { header: "Line Revenue", key: "revenue", width: 12 },
        { header: "Line Profit", key: "profit", width: 12 },
        { header: "Payment Mode", key: "mode", width: 14 },
      ];
      sheet.getRow(1).font = { bold: true };

      let excelRow = 2;
      data.sales.forEach((s) => {
        s.items.forEach((it) => {
          sheet.addRow({
            date: s.date, customer: s.customerName, phone: s.phone, photo: "",
            category: it.category, design: it.design, size: it.size, qty: it.qty,
            price: it.price, cost: it.costPrice, revenue: it.qty * it.price,
            profit: it.qty * (it.price - it.costPrice), mode: s.paymentMode,
          });
          sheet.getRow(excelRow).height = 56;
          const photo = derived.photoFor(it.design);
          if (photo) {
            try {
              const base64 = photo.split(",")[1];
              const imgId = workbook.addImage({ base64, extension: "jpeg" });
              sheet.addImage(imgId, { tl: { col: 3, row: excelRow - 1 }, ext: { width: 55, height: 55 } });
            } catch (err) {}
          }
          excelRow++;
        });
      });

      const buffer = await workbook.xlsx.writeBuffer();
      const blob = new Blob([buffer], { type: "application/octet-stream" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = `Sales_Log_With_Photos_${todayISO()}.xlsx`;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
    } catch (err) {
      alert("Could not build the photo export. Try the plain CSV export instead.");
    }
    setBusy(false);
  };

  return (
    <div>
      <Section title="Export Reports">
        <Card className="mb-2">
          <div className="font-semibold text-sm mb-1">Sales Log with Photos</div>
          <div className="text-xs text-[#33202A]/50 mb-2">Excel file with each item's photo embedded next to its row. Opens directly in Excel.</div>
          <button onClick={exportSalesLogWithPhotos} disabled={busy} className="w-full bg-[#3D1F3D] text-[#FBF6F3] font-semibold py-2.5 rounded-lg flex items-center justify-center gap-2">
            {busy ? "Building file…" : "⬇️ Download Sales Log with Photos (Excel)"}
          </button>
        </Card>
        <Card className="mb-2">
          <div className="font-semibold text-sm mb-1">Sales Log</div>
          <div className="text-xs text-[#33202A]/50 mb-2">Every item sold, per transaction, with revenue and profit per line.</div>
          <button onClick={exportSalesLog} className="w-full bg-[#3D1F3D] text-[#FBF6F3] font-semibold py-2.5 rounded-lg flex items-center justify-center gap-2">
            ⬇️ Download Sales Log (CSV)
          </button>
        </Card>
        <Card>
          <div className="font-semibold text-sm mb-1">Stock Summary</div>
          <div className="text-xs text-[#33202A]/50 mb-2">Received, sold, and remaining stock per design and size, with stock value.</div>
          <button onClick={exportStockSummary} className="w-full bg-[#3D1F3D] text-[#FBF6F3] font-semibold py-2.5 rounded-lg flex items-center justify-center gap-2">
            ⬇️ Download Stock Summary (CSV)
          </button>
        </Card>
      </Section>
    </div>
  );
}
